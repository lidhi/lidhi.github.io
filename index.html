<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      /* Set the image path or URL */
      background-image: url('images/black_bg.jpg');
      
      /* Prevent the image from tiling/repeating */
      background-repeat: no-repeat;
      
      /* Scale the image to cover the entire screen */
      background-size: cover;
      
      /* Center the image */
      background-position: center;
      
      /* Keep the background fixed while scrolling (optional) */
      background-attachment: fixed;
      
      /* Fallback color if the image fails to load */
      background-color: #333333;
    }
  </style>
  <title>My First Web Page</title>
</head>
<body>

  <!-- Visible content goes inside the body -->
  <h1>Welcome to My Website</h1>
  <p>This is a basic paragraph of text on a webpage.</p>

  <h2>Useful Elements</h2>
  <p>You can add links like <a href="https://example.com">visiting Example.com</a>.</p>
  
  <ul>
    <li>First list item</li>
    <li>Second list item</li>
  </ul>

</body>
</html>
